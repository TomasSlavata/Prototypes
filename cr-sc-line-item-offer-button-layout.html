<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Rack — Line Item Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens (from Figma variables) ---------- */
  :root{
    --color-text-default: #282a2c;
    --color-text-secondary: rgba(40,42,44,0.7);
    --color-text-disabled: rgba(40,42,44,0.4);   /* #282a2cb2 */
    --color-icon-default: rgba(40,42,44,0.7);
    --color-icon-disabled: rgba(40,42,44,0.2);     /* #282a2c33 */
    --color-bg-surface: #ffffff;
    --color-border-default: rgba(40,42,44,0.13);   /* #282a2c21 */
    --color-input-border: rgba(40,42,44,0.4);      /* #282a2c66 */
    --color-primary-bg: #282a2c;
    --color-primary-bg-hover: #4a4e52;
    --color-primary-bg-disabled: #4a4e524d;
    --color-primary-label: #ffffff;
    --color-offer-card-bg: #f8f8f8;
    --color-offer-border-added: rgba(40,42,44,0.5); /* #282a2c80 */
  }

  *{ box-sizing: border-box; }

  html,body{ margin:0; padding:0; }

  body{
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#ececed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
  }

  /* ---------- Slide cart panel: 393 x 740 ---------- */
  .cart{
    width:393px;
    height:740px;
    background:var(--color-bg-surface);
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 12px 40px rgba(40,42,44,0.14);
    overflow:hidden;
  }

  /* ---------- Header / Top Bar ---------- */
  .header{ width:100%; }
  .top-bar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px;
    width:100%;
    background:var(--color-bg-surface);
    border-bottom:1px solid var(--color-border-default);
  }
  .top-bar__title{
    flex:1 0 0;
    min-width:0;
    font-size:20px;
    font-weight:600;
    line-height:26px;
    color:var(--color-text-default);
  }
  .icon-btn{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    color:var(--color-icon-default);
    background:none; border:none; padding:0; margin:0;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- Body ---------- */
  .body{
    flex:1 0 0;
    min-height:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }
  .top{ width:100%; }
  .products{ padding:20px; width:100%; }
  .product-offers{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:353px;
  }

  /* ---------- Product Card ---------- */
  .product-card{
    display:flex;
    align-items:flex-start;
    height:96px;
    width:353px;
  }
  .pc-thumb{
    width:96px; height:96px;
    max-width:144px; max-height:144px;
    overflow:hidden;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-bg-surface);
  }
  .pc-thumb img{ width:100%; height:100%; object-fit:contain; display:block; }

  .pc-container{
    flex:1 0 0;
    min-width:0;
    padding-left:16px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }
  .pc-row-1{
    display:flex;
    gap:20px;
    align-items:flex-start;
    width:100%;
  }
  .pc-name-variant{
    flex:1 0 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-size:14px;
    line-height:20px;
  }
  .pc-name{
    font-weight:600;
    color:var(--color-text-default);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }
  .name-txt{ cursor:pointer; }
  .name-txt:hover{ text-decoration:underline; }
  .pc-variant{
    font-weight:400;
    color:var(--color-text-secondary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }

  .pc-row-2{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding-top:16px;
    width:100%;
  }

  /* Quantity stepper */
  .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1px;
    background:var(--color-bg-surface);
    box-shadow:inset 0 0 0 1px var(--color-input-border);
    flex-shrink:0;
  }
  .stepper__cell{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; margin:0;
  }
  .stepper__value{
    font-size:14px;
    font-weight:400;
    line-height:20px;
    color:var(--color-text-default);
    text-align:center;
  }
  .stepper__inc{ cursor:pointer; color:var(--color-text-default); }
  .stepper__dec{ color:var(--color-icon-disabled); }
  .icon-btn svg, .stepper__cell svg, .offer-btn .ic svg{ display:block; }

  .pc-price{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    min-height:40px;
    flex-shrink:0;
    font-size:14px;
    font-weight:400;
    line-height:20px;
    color:var(--color-text-default);
    text-align:right;
    white-space:nowrap;
  }

  /* ---------- Line Item Offers ---------- */
  .line-item-offers{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:353px;
  }
  .offer-card{
    background:var(--color-offer-card-bg);
    padding:14px 16px;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    /* inside 1.5px stroke via inset shadow keeps card height at exact 72px */
    box-shadow:inset 0 0 0 1.5px transparent;
    transition:box-shadow .15s ease;
  }
  .offer-card.is-added{
    box-shadow:inset 0 0 0 1.5px var(--color-offer-border-added);
  }
  .offer-content{
    display:flex;
    gap:16px;
    align-items:flex-start;
    width:100%;
  }
  .offer-thumb{
    width:44px; height:44px;
    max-width:144px; max-height:144px;
    overflow:hidden;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--color-text-default);
  }
  .offer-thumb img{ width:100%; height:100%; object-fit:contain; display:block; }
  .pc-thumb, .offer-thumb{ cursor:pointer; }
  .offer-info{
    flex:1 0 0;
    min-width:0;
    min-height:44px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
  }
  .offer-name{
    font-size:14px;
    font-weight:600;
    line-height:20px;
    color:var(--color-text-default);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }
  .offer-price{
    display:flex;
    gap:6px;
    align-items:center;
    padding-top:2px;
    width:100%;
  }
  .offer-price span{
    font-size:14px;
    font-weight:400;
    line-height:20px;
    color:var(--color-text-default);
    white-space:nowrap;
  }
  .offer-btn-wrap{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    min-height:44px;
    flex-shrink:0;
  }
  .offer-btn{
    width:36px; height:36px;
    padding:8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-primary-bg);
    color:var(--color-primary-label);
    border:none; margin:0;
    cursor:pointer;
    flex-shrink:0;
    transition:background .12s ease;
  }
  .offer-card.is-loading .offer-btn{
    background:var(--color-primary-bg-disabled);
    cursor:default;
  }
  /* Hover & Active = bg-hover (#4a4e52) in every interactive state (+ , ✓/−), per Figma primary icon button */
  .offer-card:not(.is-loading) .offer-btn:hover,
  .offer-card:not(.is-loading) .offer-btn:active{
    background:var(--color-primary-bg-hover);
  }

  /* Icon visibility per state */
  .offer-btn .ic{ display:none; width:20px; height:20px; }
  .offer-card:not(.is-added):not(.is-loading) .offer-btn .ic-plus{ display:block; }
  .offer-card.is-loading .offer-btn .ic-spinner{ display:block; }
  .offer-card.is-added:not(.is-loading) .offer-btn .ic-check{ display:block; }
  .offer-card.is-added:not(.is-loading) .offer-btn:hover .ic-check{ display:none; }
  .offer-card.is-added:not(.is-loading) .offer-btn:hover .ic-minus{ display:block; }

  .ic-spinner svg{ transform-origin:50% 50%; }
  .offer-card.is-loading .offer-btn .ic-spinner svg{ animation:spin .7s linear infinite; will-change:transform; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  /* ---------- Footer ---------- */
  .footer{
    width:393px;
    background:var(--color-bg-surface);
    border-top:1px solid var(--color-border-default);
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .footer__sections{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
  }
  .subtotal-section{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
  }
  .subtotal{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    width:100%;
    font-size:16px;
    font-weight:600;
    line-height:22px;
    color:var(--color-text-default);
    white-space:nowrap;
  }
  #estimatedTotal{ transition:color .15s ease; }
  #estimatedTotal.is-updating{ color:var(--color-text-disabled); }
  .footer__buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:100%;
  }
  .checkout-btn{
    width:100%;
    padding:12px 20px;
    background:var(--color-primary-bg);
    color:var(--color-primary-label);
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    font-weight:600;
    line-height:22px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .checkout-btn:hover,
  .checkout-btn:active{ background:var(--color-primary-bg-hover); }
</style>
</head>

<script>
  (function(){
    var BASE = 79.99;
    var LOADING_MS = 800;
    var offers = document.querySelectorAll('#lineItemOffers .offer-card');
    var totalEl = document.getElementById('estimatedTotal');
    var countEl = document.getElementById('cartCount');
    function setUpdating(){ totalEl.classList.toggle('is-updating', Array.prototype.some.call(offers, function(c){ return c.classList.contains('is-loading'); })); }

    function recalcTotal(){
      var total = BASE, count = 1;
      offers.forEach(function(card){
        if (card.classList.contains('is-added')){
          total += parseFloat(card.getAttribute('data-price'));
          count++;
        }
      });
      totalEl.textContent = '$' + total.toFixed(2);
      countEl.textContent = count;
    }

    offers.forEach(function(card){
      var btn = card.querySelector('.offer-btn');
      btn.addEventListener('click', function(){
        if (card.classList.contains('is-loading')) return;

        if (!card.classList.contains('is-added')){
          // Add: default -> loading -> added
          card.classList.add('is-loading');
          setUpdating();
          setTimeout(function(){
            card.classList.remove('is-loading');
            card.classList.add('is-added');
            recalcTotal();
            setUpdating();
          }, LOADING_MS);
        } else {
          // Remove: added -> loading -> default
          card.classList.add('is-loading');
          setUpdating();
          setTimeout(function(){
            card.classList.remove('is-loading');
            card.classList.remove('is-added');
            recalcTotal();
            setUpdating();
          }, LOADING_MS);
        }
      });
    });
  })();
</script>
