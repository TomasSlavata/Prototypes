<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Rack — Offers carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CANDY RACK SLIDE CART TOKENS
   Figma: yYQMX3Ton1MO8y7ZfAer9y — screens 3.1 – 9.2
   Corner radii from the 60% radius preset.
   ============================================================ */
:root{
  --cr-bg-surface:      #ffffff;              /* color/bg/surface-default */
  --cr-border:          rgba(40,42,44,0.13);  /* color/border/default */
  --cr-border-input:    rgba(40,42,44,0.4);   /* color/input/border-default */
  --cr-text:            #282a2c;              /* color/text/default */
  --cr-text-secondary:  rgba(40,42,44,0.7);   /* color/text/secondary */
  --cr-icon-default:    rgba(40,42,44,0.7);   /* color/icon/default */
  --cr-icon-disabled:   rgba(40,42,44,0.2);   /* color/icon/disabled */
  --cr-btn-bg:          #282a2c;              /* color/primary-button/bg-default */
  --cr-btn-label:       #ffffff;              /* color/primary-button/label-default */

  --cr-r-thumbnail:     8px;                  /* corner-radius/60%/thumbnail */
  --cr-r-button:        12px;                 /* corner-radius/60%/button */
  --cr-r-input:         12px;                 /* corner-radius/60%/text-input */
  --cr-r-iconbutton:    12px;                 /* corner-radius/60%/smal-icon-button */
  --cr-r-card:          16px;                 /* corner-radius/60%/card */

  --cr-cart-w:  393px;
  --cr-cart-h:  740px;
  --cr-pad:     20px;

  /* set per variant by JS */
  --cr-slide-w: 353px;
  --cr-gap:     20px;
}

/* ============================================================
   PAGE + CONTROLS (prototype chrome)
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:#ececed; min-height:100vh;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}

.bar{
  position:sticky; top:0; z-index:20; padding:14px 20px;
  background:rgba(255,255,255,0.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(40,42,44,0.08);
}
.bar__inner{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:12px 28px; max-width:1040px; margin:0 auto;
}
.ctrl{display:flex; align-items:center; gap:10px}
.ctrl.is-off{opacity:.4}
.ctrl__label{
  font-size:13px; line-height:16px; color:#3c3c43; opacity:.75;
  white-space:nowrap; letter-spacing:-0.08px;
}

/* iOS segmented control — fixed segment width so switching Layout never
   reflows the bar, and 31px tall to match the switches */
.seg{
  display:inline-flex; padding:2px; gap:2px; height:31px;
  background:rgba(118,118,128,0.12); border-radius:9px;
}
.seg button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font:inherit; font-size:13px; font-weight:500; letter-spacing:-0.08px;
  color:#000; padding:0; border-radius:7px;
  width:80px; height:27px; display:grid; place-items:center;
  transition:background .2s ease, box-shadow .2s ease;
}
.seg button[aria-pressed="true"]{
  background:#fff; font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
}

/* iOS toggle */
.switch{position:relative; width:51px; height:31px; flex:0 0 auto}
.switch input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer}
.switch i{
  position:absolute; inset:0; border-radius:15.5px; pointer-events:none;
  background:rgba(120,120,128,0.16); transition:background .25s ease;
}
.switch i::after{
  content:''; position:absolute; top:2px; left:2px; width:27px; height:27px;
  background:#fff; border-radius:50%; transition:transform .25s ease;
  box-shadow:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06);
}
.switch input:checked + i{background:#1c1c1e}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:disabled{cursor:default}

.stage{display:flex; align-items:flex-start; justify-content:center; padding:40px 20px 60px}
/* the shadow has to be a filter, not box-shadow: clip-path would cut a
   box-shadow off, while drop-shadow follows the clipped squircle outline */
#frame{filter:drop-shadow(0 12px 40px rgba(40,42,44,0.14))}

/* ============================================================
   SLIDE CART — 393 × 740
   ============================================================ */
.cart{
  width:var(--cr-cart-w); height:var(--cr-cart-h);
  background:var(--cr-bg-surface); overflow:hidden;
  display:flex; flex-direction:column; color:var(--cr-text);
  /* 32px corners with 60% corner smoothing — see squirclePath() */
  clip-path:var(--cr-squircle);
}
/* Figma text styles */
.t-h-lg{font-size:20px; line-height:26px; font-weight:600}
.t-h-md{font-size:16px; line-height:22px; font-weight:600}
.t-h-sm{font-size:14px; line-height:20px; font-weight:600}
.t-body{font-size:14px; line-height:20px; font-weight:400}
.t-btn-md{font-size:14px; line-height:20px; font-weight:600}
.t-btn-lg{font-size:16px; line-height:22px; font-weight:600}
.t-strike{text-decoration:line-through; color:var(--cr-text-secondary)}

/* Top Bar — 66px */
.topbar{
  display:flex; align-items:center; gap:16px; padding:var(--cr-pad);
  border-bottom:1px solid var(--cr-border); flex:0 0 auto;
}
.topbar h2{margin:0; flex:1 0 0}
.iconbtn{
  appearance:none; border:0; background:none; padding:0; cursor:pointer;
  width:20px; height:20px; display:grid; place-items:center; color:var(--cr-icon-default);
}
.iconbtn svg,.arrow svg,.stepper svg{display:block}

/* Body — line items top, offers bottom */
.body{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:space-between}

.items{padding:var(--cr-pad)}
.item{display:flex; align-items:flex-start}
.item__thumb{
  width:96px; height:96px; flex:0 0 auto; overflow:hidden;
  border-radius:var(--cr-r-thumbnail); display:flex; align-items:center; justify-content:center;
}
.item__thumb img{width:100%; height:100%; object-fit:contain; display:block}
.item__body{flex:1 0 0; min-width:0; padding-left:16px; display:flex; flex-direction:column}
.item__row{display:flex; gap:20px; align-items:flex-start}
.item__names{flex:1 0 0; min-width:0}
.item__name,.item__variant{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item__variant{color:var(--cr-text-secondary)}
.item__qtyprice{display:flex; align-items:flex-end; justify-content:space-between; padding-top:16px}
.stepper{
  display:flex; align-items:center; padding:1px; background:var(--cr-bg-surface);
  border:1px solid var(--cr-border-input); border-radius:var(--cr-r-input);
}
.stepper > *{width:38px; height:38px; display:grid; place-items:center}
.stepper button{appearance:none; border:0; background:none; padding:0; cursor:pointer; color:var(--cr-icon-default)}
.stepper button[disabled]{color:var(--cr-icon-disabled); cursor:default}
.item__price{
  display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  min-height:40px; text-align:right; white-space:nowrap;
}

/* Cart Offers */
.offers{border-top:1px solid var(--cr-border); padding:var(--cr-pad); display:flex; flex-direction:column}
.offers__head{display:flex; align-items:center; gap:2px; padding-bottom:16px}
.offers__head h3{margin:0; flex:1 0 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.arrows{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.arrow{
  appearance:none; cursor:pointer; width:36px; height:36px; padding:8px;
  display:grid; place-items:center; color:var(--cr-icon-default);
  background:var(--cr-bg-surface); border:1px solid var(--cr-border);
  border-radius:var(--cr-r-iconbutton);
}
.arrow[disabled]{color:var(--cr-icon-disabled); cursor:default}
.arrow--next svg{transform:scaleX(-1)}

/* Footer — 124px */
.footer{border-top:1px solid var(--cr-border); padding:var(--cr-pad); display:flex; flex-direction:column; gap:16px; flex:0 0 auto}
.subtotal{display:flex; justify-content:space-between; white-space:nowrap}
.btn{
  appearance:none; border:0; cursor:pointer; font-family:inherit;
  background:var(--cr-btn-bg); color:var(--cr-btn-label); border-radius:var(--cr-r-button);
}
.btn--lg{width:100%; padding:12px 20px; text-align:center}
.btn--md{padding:10px 20px; text-align:center}

/* ============================================================
   CAROUSEL
   ============================================================ */
.viewport{
  overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
  scrollbar-width:none; cursor:grab;
}
.viewport::-webkit-scrollbar{display:none}
.viewport.is-grabbing,
.viewport.is-grabbing *{cursor:grabbing}
.viewport.no-snap{scroll-snap-type:none}
/* without these, dragging a photo or a link starts a native drag
   instead of scrolling the carousel */
.track{-webkit-user-select:none; user-select:none}
.offer__thumb img{-webkit-user-drag:none}
.track{display:flex; gap:var(--cr-gap); align-items:stretch}
.slide{flex:0 0 auto; width:var(--cr-slide-w); scroll-snap-align:start; display:flex}
/* trailing 20px so the last card stops on the grid line, not on the cart edge.
   Has to be a real element — Chromium drops the scroller's padding-right and
   the last child's margin-right from scrollWidth. */
.tail{flex:0 0 auto; width:var(--cr-pad); margin-left:calc(-1 * var(--cr-gap))}

/* peek variants bleed to the cart edges so the sliver reaches the right edge */
.viewport.is-bleed{
  margin-left:calc(-1 * var(--cr-pad)); margin-right:calc(-1 * var(--cr-pad));
  padding-left:var(--cr-pad); scroll-padding-left:var(--cr-pad);
}

/* Dot Navigation — 8px dots, gap 8, padding-top 16 */
.dots{display:flex; align-items:center; justify-content:center; gap:8px; padding-top:16px; align-self:center}
.dot{
  appearance:none; border:0; padding:0; cursor:pointer; width:8px; height:8px;
  border-radius:50%; background:var(--cr-icon-disabled); transition:background .15s ease;
}
.dot[aria-current="true"]{background:var(--cr-text)}

/* ============================================================
   OFFER CARD
   ============================================================ */
.offer{flex:1 1 auto; min-width:0}
/* thumbnail and name link to the product detail page; in the prototype the
   click goes nowhere, only the cursor and the underline change */
.pdp{cursor:pointer; color:inherit; text-decoration:none; -webkit-user-drag:none}
/* The name has to stay a block so it can clamp and truncate, but the link
   target must be the glyphs only — not the empty rest of the line. So the
   block passes pointer events through and the inner span picks them up. */
.pdp--text{pointer-events:none}
.pdp--text > span{pointer-events:auto; cursor:pointer; -webkit-user-drag:none}
.pdp--text > span:hover{text-decoration:underline}
/* …but never while dragging the carousel */
.viewport.is-grabbing .pdp--text > span{text-decoration:none !important}
.offer__thumb{overflow:hidden; border-radius:var(--cr-r-thumbnail); background-size:cover; background-position:center; position:relative; display:block}
.offer__thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}

/* borderless — list */
.offer--list{display:flex; align-items:flex-start}
.offer--list .offer__thumb{width:96px; height:96px; flex:0 0 auto}
.offer--list .offer__body{flex:1 0 0; min-width:0; padding-left:16px; display:flex; flex-direction:column; justify-content:center; min-height:96px}
.offer--list .offer__btn{display:flex; align-items:center; justify-content:center; padding-left:16px; min-height:96px; flex:0 0 auto}

/* borderless — grid */
.offer--grid{display:flex; flex-direction:column}
.offer--grid .offer__thumb{width:100%; aspect-ratio:1/1}
.offer--grid .offer__body{padding-top:12px}
/* margin-top:auto keeps every Add button on the same baseline when the
   cards in a row have names of different lengths */
.offer--grid .offer__btn{padding-top:16px; display:flex; margin-top:auto}
.offer--grid .offer__btn .btn{flex:1 0 0; min-width:0}

/* bordered — Figma draws the stroke inside the frame, so 14px of visual
   padding = 1px border + 13px padding in CSS. Keeps thumbnails exact. */
.offer--bordered{border:1px solid var(--cr-border); border-radius:var(--cr-r-card); padding:13px}
.offer--bordered.offer--list .offer__thumb{width:82px; height:82px}
.offer--bordered.offer--list .offer__body,
.offer--bordered.offer--list .offer__btn{min-height:82px}

/* product name wraps up to 3 lines, then truncates with an ellipsis */
.offer__name{
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; text-overflow:ellipsis;
}
.offer__price{display:flex; flex-wrap:wrap; align-items:center; gap:0 6px; padding-top:2px; white-space:nowrap}
</style>
</head>
<body>

<div class="bar">
  <div class="bar__inner">
    <div class="ctrl">
      <span class="ctrl__label">Layout</span>
      <div class="seg" id="c-layout"><button data-val="list">List</button><button data-val="grid">Grid</button></div>
    </div>

    <div class="ctrl">
      <span class="ctrl__label">Visible cards</span>
      <div class="seg" id="c-peek">
        <button data-val="plain" data-plain>1</button>
        <button data-val="peek" data-peek>1 + peek</button>
      </div>
    </div>

    <div class="ctrl">
      <span class="ctrl__label">Border</span>
      <label class="switch"><input type="checkbox" id="c-border"><i></i></label>
    </div>

    <div class="ctrl">
      <span class="ctrl__label">Arrows</span>
      <label class="switch"><input type="checkbox" id="c-arrows" checked><i></i></label>
    </div>

    <div class="ctrl" id="c-dots-wrap">
      <span class="ctrl__label">Dot navigation</span>
      <label class="switch"><input type="checkbox" id="c-dots"><i></i></label>
    </div>
  </div>
</div>

<div class="stage"><div id="frame"></div></div>

<script>
/* ============================================================
   SQUIRCLE — Figma corner radius + corner smoothing
   Rounded corners in CSS are circular arcs; Figma's smoothing
   blends the arc into the straight edge with bezier shoulders.
   Same construction Figma uses: a shortened arc plus two
   symmetric cubics on either side of it.
   ============================================================ */
function squirclePath(w, h, radius, smoothing){
  const rad = deg => deg * Math.PI / 180;
  const budget = Math.min(w, h) / 2;
  const r = Math.min(radius, budget);
  const s = Math.min(smoothing, budget / r - 1);
  const p = Math.min((1 + s) * r, budget);          // how far the corner reaches along each edge

  const arcMeasure = 90 * (1 - s);                  // the arc keeps only part of the 90°
  const arc   = Math.sin(rad(arcMeasure / 2)) * r * Math.SQRT2;
  const alpha = (90 - arcMeasure) / 2;
  const beta  = 45 * s;
  const c = r * Math.tan(rad(alpha / 2)) * Math.cos(rad(beta));
  const d = c * Math.tan(rad(beta));
  const b = (p - arc - c - d) / 3;
  const a = 2 * b;
  const n = v => +v.toFixed(3);
  const abc = a + b + c;

  return `path("M ${n(w - p)} 0 \
c ${n(a)} 0 ${n(a + b)} 0 ${n(abc)} ${n(d)} \
a ${n(r)} ${n(r)} 0 0 1 ${n(arc)} ${n(arc)} \
c ${n(d)} ${n(c)} ${n(d)} ${n(b + c)} ${n(d)} ${n(abc)} \
L ${n(w)} ${n(h - p)} \
c 0 ${n(a)} 0 ${n(a + b)} ${n(-d)} ${n(abc)} \
a ${n(r)} ${n(r)} 0 0 1 ${n(-arc)} ${n(arc)} \
c ${n(-c)} ${n(d)} ${n(-(b + c))} ${n(d)} ${n(-abc)} ${n(d)} \
L ${n(p)} ${n(h)} \
c ${n(-a)} 0 ${n(-(a + b))} 0 ${n(-abc)} ${n(-d)} \
a ${n(r)} ${n(r)} 0 0 1 ${n(-arc)} ${n(-arc)} \
c ${n(-d)} ${n(-c)} ${n(-d)} ${n(-(b + c))} ${n(-d)} ${n(-abc)} \
L 0 ${n(p)} \
c 0 ${n(-a)} 0 ${n(-(a + b))} ${n(d)} ${n(-abc)} \
a ${n(r)} ${n(r)} 0 0 1 ${n(arc)} ${n(-arc)} \
c ${n(c)} ${n(-d)} ${n(b + c)} ${n(-d)} ${n(abc)} ${n(-d)} Z")`;
}

document.documentElement.style.setProperty('--cr-squircle', squirclePath(393, 740, 32, 0.6));

/* ============================================================
   ICONS — exported from the Figma slide cart components
   ============================================================ */
const SVG = (p, extra = '') =>
  `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true" ${extra}>${p}</svg>`;

const ICON = {
  cancel: SVG(`<path d="M3.21967 3.21967C3.51256 2.92678 3.98744 2.92678 4.28033 3.21967L10.0008 8.94016L15.7213 3.21967C16.0142 2.92678 16.4891 2.92678 16.782 3.21967C17.0749 3.51256 17.0749 3.98744 16.782 4.28033L11.0615 10.0008L16.782 15.7213C17.0749 16.0142 17.0749 16.4891 16.782 16.782C16.4891 17.0749 16.0142 17.0749 15.7213 16.782L10.0008 11.0615L4.28033 16.782C3.98744 17.0749 3.51256 17.0749 3.21967 16.782C2.92678 16.4891 2.92678 16.0142 3.21967 15.7213L8.94016 10.0008L3.21967 4.28033C2.92678 3.98744 2.92678 3.51256 3.21967 3.21967Z" fill="currentColor"/>`),
  del: SVG(`<path fill-rule="evenodd" clip-rule="evenodd" d="M7.24994 5.25C7.24994 3.73122 8.48116 2.5 9.99994 2.5C11.5187 2.5 12.7499 3.73122 12.7499 5.25H15.75C16.1642 5.25 16.5 5.58579 16.5 6C16.5 6.41421 16.1642 6.75 15.75 6.75H14.9999L14.9998 12.2001C14.9998 13.8802 14.9997 14.7203 14.6728 15.362C14.3851 15.9265 13.9262 16.3854 13.3617 16.673C12.72 17 11.8799 17 10.1997 17H9.79999C8.11978 17 7.27968 17 6.63793 16.673C6.07343 16.3854 5.61448 15.9264 5.32687 15.3619C4.99989 14.7202 4.9999 13.8801 4.99994 12.1999L5.00005 6.75H4.25C3.83579 6.75 3.5 6.41421 3.5 6C3.5 5.58579 3.83579 5.25 4.25 5.25H7.24994ZM8.74994 5.25C8.74994 4.55964 9.30958 4 9.99994 4C10.6903 4 11.2499 4.55964 11.2499 5.25H8.74994ZM6.50007 6.75H13.4999L13.4998 12.2001C13.4998 13.0649 13.4986 13.6233 13.4639 14.0483C13.4305 14.4558 13.374 14.6068 13.3362 14.681C13.1924 14.9632 12.963 15.1927 12.6807 15.3365C12.6065 15.3743 12.4555 15.4308 12.048 15.4641C11.623 15.4988 11.0646 15.5 10.1997 15.5H9.79999C8.93513 15.5 8.37671 15.4988 7.95169 15.4641C7.54418 15.4308 7.3931 15.3743 7.31893 15.3365C7.03668 15.1927 6.80721 14.9632 6.6634 14.681C6.62561 14.6068 6.56909 14.4557 6.53581 14.0482C6.50109 13.6232 6.49994 13.0648 6.49995 12.1999L6.50007 6.75Z" fill="currentColor"/>`),
  plus: SVG(`<path d="M10 5C9.58579 5 9.25 5.33579 9.25 5.75V9.25H5.75C5.33579 9.25 5 9.58579 5 10C5 10.4142 5.33579 10.75 5.75 10.75H9.25V14.25C9.25 14.6642 9.58579 15 10 15C10.4142 15 10.75 14.6642 10.75 14.25V10.75H14.25C14.6642 10.75 15 10.4142 15 10C15 9.58579 14.6642 9.25 14.25 9.25H10.75V5.75C10.75 5.33579 10.4142 5 10 5Z" fill="currentColor"/>`),
  minus: SVG(`<rect x="5" y="9.25" width="10" height="1.5" rx="0.75" fill="currentColor"/>`),
  chevron: SVG(`<path d="M10.6196 14.7789C10.9125 15.0718 11.3873 15.0718 11.6802 14.7789C11.9731 14.486 11.9731 14.0111 11.6802 13.7182L7.96129 9.99927L11.6802 6.28033C11.9731 5.98744 11.9731 5.51256 11.6802 5.21967C11.3873 4.92678 10.9125 4.92678 10.6196 5.21967L6.39221 9.44703C6.38465 9.454 6.3772 9.46116 6.36986 9.4685C6.22273 9.61563 6.14951 9.80868 6.15019 10.0015C6.15065 10.1929 6.22387 10.3841 6.36986 10.53C6.37718 10.5374 6.38461 10.5445 6.39216 10.5515L10.6196 14.7789Z" fill="currentColor"/>`)
};

/* ============================================================
   PRODUCTS
   Photos come from ./imgs/carousel-layout/. If the folder isn't
   next to this file the thumbnails fall back to a drawing, so the
   prototype still renders when opened on its own.

const PRODUCTS = [
  { name:'Happy Stripe Socks', regular:'$19.99', price:'$9.99',  file:'socks.png',        art:ART.socks },
  { name:"Nike Men's Dri-FIT", regular:'$79.99', price:'$69.99', file:'dri-fit.png',      art:ART.shorts },
  { name:'Nike Backpack',      regular:null,     price:'$49.99', file:'backpack.png',     art:ART.backpack },
  { name:'Nike Sneaker Sock',  regular:null,     price:'$9.99',  file:'sneaker-sock.png', art:ART.sock }
];

/* ============================================================
   GEOMETRY — every number taken from the Figma screens
   ============================================================ */
const GEO = {
  list: {
    plain:{ off:{w:353,   gap:20}, on:{w:353,   gap:12} },   // 3.x / 4.x
    peek: { off:{w:320,   gap:20}, on:{w:320,   gap:12} }    // 5.1 (border on); border off derived
  },
  grid: {
    plain:{ off:{w:168.5, gap:16}, on:{w:170.5, gap:12} },   // 6.x / 7.x
    peek: { off:{w:152,   gap:20}, on:{w:152,   gap:12} }    // 8.x / 9.x
  }
};
const PER_VIEW = { list:1, grid:2 };

const state = { layout:'list', peek:'plain', border:false, arrows:true, dots:false };

/* dot navigation only exists on the list layout without peek */
const dotsAllowed = () => state.layout === 'list' && state.peek === 'plain';

/* ============================================================
   MARKUP
   ============================================================ */
function offerCard(p, layout, bordered){
  return `<div class="offer offer--${layout}${bordered ? ' offer--bordered' : ''}">
    <a class="offer__thumb pdp" href="#" draggable="false" aria-label="${p.name}"
       style="background-image:url('${p.art}')">
      <img src="${IMG_DIR}${p.file}" alt="" draggable="false" onerror="this.remove()">
    </a>
    <div class="offer__body">
      <a class="offer__name pdp pdp--text t-h-sm" href="#" draggable="false"><span>${p.name}</span></a>
      <div class="offer__price t-body">
        ${p.regular ? `<span class="t-strike">${p.regular}</span>` : ''}<span>${p.price}</span>
      </div>
    </div>
    <div class="offer__btn"><button class="btn btn--md t-btn-md" type="button">Add</button></div>
  </div>`;
}

function cartHtml(){
  const { layout, peek, border, arrows } = state;
  const isPeek   = peek === 'peek';
  const geo      = GEO[layout][peek][border ? 'on' : 'off'];
  const showDots = state.dots && dotsAllowed();

  const slides = PRODUCTS.map(p => `<div class="slide">${offerCard(p, layout, border)}</div>`).join('');

  return `<div class="cart" style="--cr-slide-w:${geo.w}px; --cr-gap:${geo.gap}px">
    <div class="topbar">
      <h2 class="t-h-lg">Cart (1)</h2>
      <button class="iconbtn" type="button" aria-label="Close cart">${ICON.cancel}</button>
    </div>

    <div class="body">
      <div class="items">
        <div class="item">
          <a class="item__thumb pdp" href="#" draggable="false" aria-label="Nike Zoom Fly 5 Premium">
            <img src="${IMG_DIR}line-item-1.png" alt="" draggable="false"
              onerror="this.onerror=null; this.src=SHOE_FALLBACK">
          </a>
          <div class="item__body">
            <div class="item__row">
              <div class="item__names">
                <a class="item__name pdp pdp--text t-h-sm" href="#" draggable="false"><span>Nike Zoom Fly 5 Premium</span></a>
                <div class="item__variant t-body">44 / White</div>
              </div>
              <button class="iconbtn" type="button" aria-label="Remove item">${ICON.del}</button>
            </div>
            <div class="item__qtyprice">
              <div class="stepper">
                <button type="button" disabled aria-label="Decrease quantity">${ICON.minus}</button>
                <div class="t-body">1</div>
                <button type="button" aria-label="Increase quantity">${ICON.plus}</button>
              </div>
              <div class="item__price t-body"><span>$79.99</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="offers">
        <div class="offers__head">
          <h3 class="t-h-md">Get extras for your product</h3>
          ${arrows ? `<div class="arrows">
            <button class="arrow arrow--prev" type="button" data-dir="-1" aria-label="Previous offer">${ICON.chevron}</button>
            <button class="arrow arrow--next" type="button" data-dir="1" aria-label="Next offer">${ICON.chevron}</button>
          </div>` : ''}
        </div>
        <div class="viewport${isPeek ? ' is-bleed' : ''}">
          <div class="track">${slides}${isPeek ? '<div class="tail" aria-hidden="true"></div>' : ''}</div>
        </div>
        ${showDots ? `<div class="dots">${PRODUCTS.map((_, i) =>
          `<button class="dot" type="button" data-i="${i}" aria-label="Offer ${i + 1}"></button>`).join('')}</div>` : ''}
      </div>
    </div>

    <div class="footer">
      <div class="subtotal t-h-md"><span>Subtotal</span><span>$79.99</span></div>
      <button class="btn btn--lg t-btn-lg" type="button">Checkout</button>
    </div>
  </div>`;
}

/* ============================================================
   CAROUSEL — one card per step
   ============================================================ */
function initCarousel(offers){
  const viewport = offers.querySelector('.viewport');
  const track    = offers.querySelector('.track');
  const slides   = [...track.querySelectorAll('.slide')];
  const dots     = [...offers.querySelectorAll('.dot')];
  const arrows   = [...offers.querySelectorAll('.arrow')];

  const step = () => slides[0].offsetWidth + parseFloat(getComputedStyle(track).columnGap || 0);
  const max  = () => viewport.scrollWidth - viewport.clientWidth;

  /* Raw (unclamped) card offsets. Stepping has to use these: near the end
     several cards clamp to the same scroll offset, and stepping off the
     clamped values is what used to freeze the back arrow on the last card. */
  const raw = () => slides.map((_, i) => i * step());

  /* index of the card whose snap offset sits closest to a given scroll x */
  function nearestTo(x){
    const m = max();
    let best = 0, bestD = Infinity;
    raw().forEach((v, i) => { const d = Math.abs(Math.min(v, m) - x); if (d <= bestD + 0.5){ bestD = d; best = i; } });
    return best;
  }

  function sync(){
    const i = nearestTo(viewport.scrollLeft), m = max();
    dots.forEach((d, n) => d.setAttribute('aria-current', String(n === i)));
    arrows.forEach(a => {
      a.disabled = Number(a.dataset.dir) < 0 ? viewport.scrollLeft <= 1 : viewport.scrollLeft >= m - 1;
    });
  }

  function scrollToIndex(i){
    const m = max();
    const target = Math.max(0, Math.min(raw()[Math.max(0, Math.min(i, slides.length - 1))], m));
    viewport.scrollTo({ left: target, behavior: 'smooth' });
  }

  function stepBy(dir){
    const x = viewport.scrollLeft, offsets = raw();
    if (dir > 0){
      const next = offsets.findIndex(v => v > x + 1);
      if (next !== -1) scrollToIndex(next);
    } else {
      let prev = -1;
      offsets.forEach((v, i) => { if (v < x - 1) prev = i; });
      if (prev !== -1) scrollToIndex(prev);
    }
  }

  dots.forEach(d => d.addEventListener('click', () => scrollToIndex(Number(d.dataset.i))));
  arrows.forEach(a => a.addEventListener('click', () => stepBy(Number(a.dataset.dir))));

  let raf;
  viewport.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }, { passive:true });

  /* ---- mouse / trackpad drag -------------------------------------------
     A desktop mouse has no horizontal scroll gesture, so click-and-drag
     has to be built. Four things make it feel right:
       1. pointer capture — the drag survives leaving the carousel
       2. axis lock — a mostly-vertical gesture is handed back to the page
       3. velocity projection — a flick keeps travelling after release
       4. snapping stays off until the release animation has settled  */
  const PROJECTION = 140;   // ms of coasting after release
  const FLICK      = 0.32;  // px/ms above which a flick always advances a card

  let drag = null, suppressClick = false;

  function snapOff(on){ viewport.classList.toggle('no-snap', on); }

  function settleThen(fn){
    let done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(t); fn(); };
    viewport.addEventListener('scrollend', finish, { once:true });
    const t = setTimeout(finish, 700);   // fallback for browsers without scrollend
  }

  viewport.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0) return;   // native touch scrolling is better
    drag = {
      id:e.pointerId, x0:e.clientX, y0:e.clientY, left0:viewport.scrollLeft,
      lastX:e.clientX, lastT:performance.now(), v:0, axis:null
    };
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;

    if (!drag.axis){
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      if (Math.abs(dy) > Math.abs(dx)){ endDrag(); return; }   // vertical: let the page scroll
      drag.axis = 'x';
      viewport.classList.add('is-grabbing');
      snapOff(true);
    }

    const now = performance.now(), dt = now - drag.lastT;
    if (dt > 0){
      const inst = (e.clientX - drag.lastX) / dt;
      drag.v = drag.v * 0.7 + inst * 0.3;      // smoothed, so one stuttery frame can't throw the flick
      drag.lastX = e.clientX; drag.lastT = now;
    }
    viewport.scrollLeft = drag.left0 - dx;
    suppressClick = true;
    e.preventDefault();
  });

  function endDrag(){
    if (!drag) return;
    const d = drag; drag = null;
    if (viewport.hasPointerCapture?.(d.id)) viewport.releasePointerCapture(d.id);
    viewport.classList.remove('is-grabbing');

    if (d.axis !== 'x'){ snapOff(false); return; }

    /* where the carousel would coast to, then the card nearest that point */
    const stale = performance.now() - d.lastT > 120;      // paused before releasing = no flick
    const v = stale ? 0 : d.v;
    let i = nearestTo(viewport.scrollLeft - v * PROJECTION);

    if (Math.abs(v) > FLICK){
      const from = nearestTo(d.left0);
      if (v < 0) i = Math.max(i, from + 1);               // dragged left → next card
      else       i = Math.min(i, from - 1);               // dragged right → previous card
    }

    scrollToIndex(i);
    settleThen(() => snapOff(false));
    setTimeout(() => { suppressClick = false; }, 80);   // fallback if no click follows
  }

  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
  viewport.addEventListener('lostpointercapture', endDrag);
  viewport.addEventListener('dragstart', e => e.preventDefault());
  viewport.addEventListener('click', e => {
    if (suppressClick){                 // this click is the tail of a drag
      e.preventDefault(); e.stopPropagation(); suppressClick = false;
    }
  }, true);

  sync();
}

/* ============================================================
   RENDER + CONTROLS
   ============================================================ */
function render(){
  const n = state.layout === 'list' ? '1' : '2';
  document.querySelector('[data-plain]').textContent = n;
  document.querySelector('[data-peek]').textContent  = n + ' + peek';

  const allowed = dotsAllowed();
  document.getElementById('c-dots-wrap').classList.toggle('is-off', !allowed);
  document.getElementById('c-dots').disabled = !allowed;

  document.getElementById('frame').innerHTML = cartHtml();
  initCarousel(document.querySelector('.offers'));
}

function paintSegs(){
  [['c-layout','layout'], ['c-peek','peek']].forEach(([id, key]) =>
    document.getElementById(id).querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.val === state[key]))));
}

[['c-layout','layout'], ['c-peek','peek']].forEach(([id, key]) => {
  document.getElementById(id).querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { state[key] = b.dataset.val; paintSegs(); render(); }));
});

['border','arrows','dots'].forEach(key => {
  const el = document.getElementById('c-' + key);
  el.checked = state[key];
  el.addEventListener('change', () => { state[key] = el.checked; render(); });
});

/* PDP links go nowhere in the prototype. Bubble phase, so the carousel's
   capture-phase handler can swallow a click that is really a drag first. */
document.addEventListener('click', e => {
  if (e.target.closest('.pdp')) e.preventDefault();
});

paintSegs(); render();
</script>
