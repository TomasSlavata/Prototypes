<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Description — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Polaris tokens (mirrored from Figma) */
    --p-bg-surface:#ffffff;
    --p-surface-tertiary:#f3f3f3;
    --p-border:#e3e3e3;
    --p-text:#303030;
    --p-text-secondary:#616161;

    --input-bg:#fdfdfd;
    --input-bg-hover:#fafafa;
    --input-border:#8a8a8a;
    --input-border-hover:#616161;
    --input-border-active:#1a1a1a;
    --border-focus:#005bd3;
    --focus-bg-default:#f7f7f7;
    --ring-offset:4px;

    --surface-magic:#f8f7ff;
    --surface-magic-hover:#f3f1ff;
    --border-magic:#9474ff;
    --border-magic-hover:#8051ff;
    --text-magic:#5700d1;
    --text-magic-secondary:#7126ff;

    --icon-magic:#8051ff;
    --bg-magic-hover:#dfd9ff;
    --icon-disabled:#cccccc;

    --radius-btn:8px;
    --radius-modal:16px;

    --fill-brand:#303030;
    --fill-brand-disabled:rgba(0,0,0,0.17);

    --s050:2px; --s100:4px; --s150:6px; --s200:8px; --s300:12px; --s400:16px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#ebebeb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    color:var(--p-text);
    -webkit-font-smoothing:antialiased;
  }

  /* dimmed modal backdrop */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(26,26,26,0.30);
  }

  /* ---------- Modal ---------- */
  .modal{
    position:relative;
    width:620px; max-width:100%;
    background:var(--p-bg-surface);
    border-radius:var(--radius-modal);
    overflow:hidden;
    box-shadow:
      0px 20px 20px -8px rgba(26,26,26,0.28),
      inset 0px 1px 0px 0px rgba(204,204,204,0.5),
      inset 0px -1px 0px 0px rgba(0,0,0,0.17),
      inset 1px 0px 0px 0px rgba(0,0,0,0.13),
      inset -1px 0px 0px 0px rgba(0,0,0,0.17);
  }

  /* ---------- Title bar ---------- */
  .titlebar{
    display:flex; align-items:center;
    background:var(--p-surface-tertiary);
    border-bottom:1px solid var(--p-border);
    padding:var(--s300) var(--s300) var(--s300) var(--s400);
  }
  .titlebar h2{
    margin:0; flex:1;
    font-size:14px; font-weight:650; line-height:20px;
    color:var(--p-text);
  }
  .close-btn{
    flex:none;
    display:flex; align-items:center; justify-content:center;
    width:28px; height:28px;
    border:none; background:transparent;
    border-radius:var(--radius-btn);
    cursor:pointer; color:#4a4a4a;
    transition:background .12s ease;
  }
  .close-btn:hover{background:rgba(0,0,0,0.05);}
  .close-btn svg{width:20px;height:20px;}

  /* ---------- Content ---------- */
  .content{padding:var(--s400);}

  .field-row{position:relative; padding-top:4px;}

  .field{
    display:flex; flex-direction:column; gap:var(--s100);
    width:100%;
  }
  .field-label{
    font-size:13px; font-weight:450; line-height:20px;
    color:var(--p-text);
  }

  /* input box */
  .input{
    position:relative;
    display:flex; flex-direction:column; gap:var(--s100);
    background:var(--input-bg);
    border:0.66px solid var(--input-border);
    border-radius:var(--radius-btn);
    padding:var(--s150) var(--s300);
    cursor:text;
    transition:background .18s ease, border-color .14s ease;
  }
  .input textarea{
    width:100%; border:none; outline:none; resize:none;
    background:transparent;
    font-family:inherit;
    font-size:13px; font-weight:450; line-height:20px;
    color:var(--p-text);
    padding:0; margin:0;
    overflow:hidden;
    min-height:20px;
  }
  .input textarea::placeholder{color:#8a8a8a;}
  .charcount{
    align-self:flex-end;
    font-size:13px; font-weight:450; line-height:20px;
    color:var(--p-text-secondary);
    user-select:none;
    transition:color .18s ease;
  }
  .help{
    font-size:13px; font-weight:450; line-height:20px;
    color:var(--p-text-secondary);
  }

  /* generating overlay text — gradient shimmer sweep */
  .gen-status{
    position:absolute; left:var(--s300); top:var(--s150);
    font-size:13px; font-weight:450; line-height:20px;
    display:none; pointer-events:none; user-select:none;
    white-space:nowrap;
    background-image:linear-gradient(100deg,
      var(--text-magic) 0%,
      var(--text-magic) 44%,
      var(--surface-magic) 50%,
      var(--text-magic) 56%,
      var(--text-magic) 100%);
    background-size:300% 100%;
    background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .field.generating .gen-status{
    display:block;
    animation:gen-shimmer 1500ms linear infinite;
  }
  @keyframes gen-shimmer{
    0%      {background-position:100% 0;}   /* solid (band off-screen) */
    66.67%  {background-position:0% 0;}      /* sweep across — ~1000ms */
    100%    {background-position:0% 0;}      /* hold = pause ~500ms */
  }

  /* ---- DEFAULT tone hover ---- */
  .field:not(.magic):not(.focused):not(.generating) .input:hover{
    background:var(--input-bg-hover);
    border-color:var(--input-border-hover);
  }

  /* ---- MAGIC tone ---- */
  .field.magic .input{
    background:var(--surface-magic);
    border-color:var(--border-magic);
  }
  .field.magic:not(.focused):not(.generating) .input:hover{
    background:var(--surface-magic-hover);
    border-color:var(--border-magic-hover);
  }
  .field.magic:not(.focused) .input textarea{color:var(--text-magic);}
  .field.magic:not(.focused) .charcount{color:var(--text-magic-secondary);}

  /* ---- GENERATING ---- */
  .field.generating .input{
    background:var(--surface-magic);
    border-color:var(--border-magic);
  }
  .field.generating .input textarea{visibility:hidden;}
  .field.generating .gen-status{display:block;}
  .field.generating .charcount{color:var(--text-magic-secondary);}

  /* ---- FOCUS ring (Polaris) ---- */
  .field.focused .input::after{
    content:'';
    position:absolute; inset:calc(-1 * var(--ring-offset));
    border:2px solid var(--border-focus);
    border-radius:calc(var(--radius-btn) + var(--ring-offset));
    pointer-events:none;
  }
  /* default-tone focus: grey fill + grey border under the ring */
  .field.focused:not(.magic) .input{
    background:var(--focus-bg-default);
    border-color:var(--input-border-hover);
  }
  /* magic-tone focus: keep magic fill, dark active border */
  .field.focused.magic .input{
    border-color:var(--input-border-active);
  }

  /* ---------- Magic icon button ---------- */
  .icon-btn{
    position:absolute; top:0; right:0;
    display:flex; align-items:center; justify-content:center;
    width:24px; height:24px; padding:0;
    border:none; background:transparent;
    border-radius:var(--radius-btn);
    cursor:pointer;
    color:var(--icon-magic);
    transition:background .12s ease, color .12s ease;
  }
  .icon-btn:hover{background:var(--bg-magic-hover);}
  .icon-btn:active{background:#cfc6ff;}
  .icon-btn svg{width:20px;height:20px;display:block;}
  /* generating → disabled state (flat grey, no hover, no animation) */
  .icon-btn.is-busy{color:var(--icon-disabled); cursor:default;}
  .icon-btn.is-busy:hover{background:transparent;}

  /* tooltip */
  .tooltip{
    position:absolute;
    bottom:calc(100% + 8px);
    right:-6px;
    background:var(--p-bg-surface);
    color:var(--p-text);
    font-size:13px; font-weight:450; line-height:20px;
    padding:var(--s100) var(--s200);
    border-radius:8px;
    white-space:nowrap;
    box-shadow:
      0px 4px 6px -2px rgba(26,26,26,0.20),
      inset 0px 1px 0px 0px rgba(204,204,204,0.5),
      inset 0px -1px 0px 0px rgba(0,0,0,0.17),
      inset 1px 0px 0px 0px rgba(0,0,0,0.13),
      inset -1px 0px 0px 0px rgba(0,0,0,0.13);
    opacity:0; transform:translateY(2px);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .tooltip::after{
    content:'';
    position:absolute;
    bottom:-5px; right:13px;
    width:10px; height:10px;
    background:var(--p-bg-surface);
    /* border only on the two downward-facing edges → continues the body border */
    border-right:1px solid rgba(0,0,0,0.15);
    border-bottom:1px solid rgba(0,0,0,0.15);
    border-bottom-right-radius:2px;
    transform:rotate(45deg);
  }
  .icon-btn:hover .tooltip{opacity:1; transform:translateY(0);}
  .icon-btn.is-busy .tooltip,
  .icon-btn[disabled] .tooltip{display:none;}

  /* ---------- Footer ---------- */
  .footer{
    display:flex; align-items:center; justify-content:flex-end;
    gap:var(--s200);
    height:60px;
    padding:var(--s400);
    background:var(--p-bg-surface);
    border-top:1px solid var(--p-border);
  }
  .btn{
    font-family:inherit;
    font-size:12px; line-height:16px;
    border-radius:var(--radius-btn);
    padding:var(--s150) var(--s300);
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  /* secondary */
  .btn-secondary{
    font-weight:550;
    background:var(--p-bg-surface);
    color:var(--p-text);
    border:none;
    box-shadow:
      inset 0px 1px 0px 0px var(--p-border),
      inset 0px -1px 0px 0px #b5b5b5,
      inset 1px 0px 0px 0px var(--p-border),
      inset -1px 0px 0px 0px var(--p-border);
  }
  .btn-secondary:hover{background:#fafafa;}
  /* primary */
  .btn-primary{
    font-weight:600;
    color:#ffffff;
    border:none;
    background:var(--fill-brand-disabled);
    cursor:default;
    transition:background .15s ease;
  }
  .btn-primary.enabled{
    cursor:pointer;
    background:var(--fill-brand);
    box-shadow:
      inset 0px 1px 0px 0px #000,
      inset 0px -1px 0px 1px #000,
      inset 0px 2px 0px 0px rgba(255,255,255,0.2),
      inset 2px 0px 0px 0px rgba(255,255,255,0.2),
      inset -2px 0px 0px 0px rgba(255,255,255,0.2);
  }
  .btn-primary.enabled:hover{background:#1a1a1a;}
</style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="modal" role="dialog" aria-modal="true" aria-label="Description">
    <!-- Title bar -->
    <div class="titlebar">
      <h2>Description</h2>
      <button class="close-btn" id="closeBtn" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="field-row">
        <div class="field" id="field">
          <label class="field-label" for="ta">Description</label>
          <div class="input" id="inputBox">
            <textarea id="ta" rows="1" maxlength="200" placeholder=""></textarea>
            <span class="gen-status" id="genStatus">Generating…</span>
            <span class="charcount" id="charcount">0/200</span>
          </div>
          <div class="help">Keep it short and benefit-led. One or two sentences works best.</div>
        </div>

        <!-- Magic generate button -->
        <button class="icon-btn" id="magicBtn" aria-label="Generate description">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M5.702 4.253a.625.625 0 0 1 1.096 0l.196.358c.207.378.517.688.895.895l.358.196a.625.625 0 0 1 0 1.097l-.358.196a2.25 2.25 0 0 0-.895.894l-.196.359a.625.625 0 0 1-1.096 0l-.196-.359a2.25 2.25 0 0 0-.895-.894l-.358-.196a.625.625 0 0 1 0-1.097l.358-.196a2.25 2.25 0 0 0 .895-.895l.196-.358Z"/>
            <path fill-rule="evenodd" d="M12.948 7.89c-.18-1.167-1.852-1.19-2.064-.029l-.03.164a3.756 3.756 0 0 1-3.088 3.031c-1.15.189-1.173 1.833-.03 2.054l.105.02a3.824 3.824 0 0 1 3.029 3.029l.032.165c.233 1.208 1.963 1.208 2.196 0l.025-.129a3.836 3.836 0 0 1 3.077-3.045c1.184-.216 1.12-1.928-.071-2.107a3.789 3.789 0 0 1-3.18-3.154Zm-.944 6.887a5.34 5.34 0 0 1 2.542-2.647 5.305 5.305 0 0 1-2.628-2.548 5.262 5.262 0 0 1-2.488 2.508 5.329 5.329 0 0 1 2.574 2.687Z"/>
          </svg>
          <span class="tooltip">Generate description</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>

<script>
  const TEXTS = [
    "Add Hip & Joint meal topper: supports joint health, mobility, and flexibility with pure glucosamine, MSM & chondroitin.",
    "Support mobility and joint health with our natural Glucosamine, MSM & Chondroitin meal topper—no added fillers.",
    "Help your dog stay active and pain-free with our natural Hip & Joint blend—supports flexible, healthy joints every day!",
    "Boost your pup's mobility with our all-natural, expertly crafted Hip & Joint blend—perfect for healthy, active joints."
  ];

  const MAX = 200;
  const field     = document.getElementById('field');
  const ta        = document.getElementById('ta');
  const charcount = document.getElementById('charcount');
  const magicBtn  = document.getElementById('magicBtn');
  const saveBtn   = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const closeBtn  = document.getElementById('closeBtn');

  let idx = 0;            // which preset text is next
  let generating = false;

  function autoresize(){
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
  function updateCount(){
    charcount.textContent = ta.value.length + '/' + MAX;
  }
  function refreshSave(){
    const has = ta.value.trim().length > 0 && !generating;
    saveBtn.classList.toggle('enabled', has);
  }

  // ----- AI generation simulation -----
  function generate(){
    if (generating) return;
    generating = true;

    // enter generating state
    field.classList.remove('focused');
    field.classList.add('magic','generating');
    magicBtn.classList.add('is-busy');
    ta.value = '';
    updateCount(); autoresize();
    saveBtn.classList.remove('enabled');

    const text = TEXTS[idx];
    idx = (idx + 1) % TEXTS.length;

    // phase 1 — "Generating…" shimmer
    setTimeout(() => {
      field.classList.remove('generating');   // reveal textarea, keep magic tone
      streamText(text);
    }, 3000);
  }

  // word-by-word streaming, like a real model response
  function streamText(text){
    const words = text.split(' ');
    let i = 0;
    ta.value = '';
    (function step(){
      if (i < words.length){
        ta.value += (i === 0 ? '' : ' ') + words[i];
        i++;
        updateCount(); autoresize();
        setTimeout(step, 45);
      } else {
        // done — magic generated state
        generating = false;
        magicBtn.classList.remove('is-busy');
        refreshSave();
      }
    })();
  }

  // ----- Events -----
  magicBtn.addEventListener('click', generate);

  // clicking anywhere inside the box (padding, counter, empty area) focuses the field
  document.getElementById('inputBox').addEventListener('mousedown', (e) => {
    if (e.target === ta) return;           // let the textarea handle precise caret placement
    e.preventDefault();                    // avoid blur flicker / stray text selection
    const end = ta.value.length;
    ta.focus();
    ta.setSelectionRange(end, end);        // place caret at end of text
  });

  // focus / blur → focus ring
  ta.addEventListener('focus', () => field.classList.add('focused'));
  ta.addEventListener('blur',  () => field.classList.remove('focused'));

  // manual typing → drop magic tone back to default
  ta.addEventListener('input', () => {
    if (!generating && field.classList.contains('magic')){
      field.classList.remove('magic');
    }
    updateCount(); autoresize(); refreshSave();
  });

  // reset to default empty state
  function reset(){
    generating = false;
    field.classList.remove('magic','generating','focused');
    magicBtn.classList.remove('is-busy');
    ta.value = '';
    ta.blur();
    updateCount(); autoresize(); refreshSave();
  }
  cancelBtn.addEventListener('click', reset);
  closeBtn.addEventListener('click', reset);

  // save → commit AI text: drop magic tone to default (no toast)
  saveBtn.addEventListener('click', () => {
    if (!saveBtn.classList.contains('enabled')) return;
    field.classList.remove('magic');
  });

  // init
  updateCount(); autoresize(); refreshSave();
</script>
</body>
</html>
